name: Build
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      # gRPC services import protoc-generated bindings from gen/, which are not rendered and
      # not committed — generate them exactly the way the production Dockerfile does (same
      # pinned plugin versions), before tidy so the local package resolves. No-op for services
      # without a proto/ directory.
      - name: Generate gRPC bindings (proto/ present)
        run: |
          if [ -d proto ]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
            go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
            go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
            mkdir -p gen && protoc -I proto \
              --go_out=gen --go_opt=paths=source_relative \
              --go-grpc_out=gen --go-grpc_opt=paths=source_relative \
              $(find proto -name '*.proto')
          fi
      # A fresh render ships no go.sum (generating one needs the Go toolchain, which rendering
      # doesn't have) — tidy materializes it so the first CI run after `git init` builds. On a
      # checkout that already carries go.sum this is a no-op.
      - run: go mod tidy
      - run: go build ./...
      - run: go test ./...
